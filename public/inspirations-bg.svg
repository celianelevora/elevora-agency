<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="g1" cx="20%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#2B6CC4" stop-opacity="0.20"/>
      <stop offset="50%" stop-color="#2B6CC4" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#2B6CC4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g2" cx="80%" cy="70%" r="55%">
      <stop offset="0%" stop-color="#C9266A" stop-opacity="0.16"/>
      <stop offset="55%" stop-color="#C9266A" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#C9266A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g3" cx="55%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#E8527E" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#E8527E" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="0.9" fill="#1B4F8A" opacity="0.10"/>
    </pattern>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="2" seed="3"/>
      <feColorMatrix values="0 0 0 0 0.10  0 0 0 0 0.10  0 0 0 0 0.18  0 0 0 0.05 0"/>
    </filter>
  </defs>
  <!-- Fond de base -->
  <rect width="1920" height="1080" fill="#EAE9EE"/>
  <!-- Pattern de points discret -->
  <rect width="1920" height="1080" fill="url(#dots)"/>
  <!-- Halos colorés -->
  <rect width="1920" height="1080" fill="url(#g1)"/>
  <rect width="1920" height="1080" fill="url(#g2)"/>
  <rect width="1920" height="1080" fill="url(#g3)"/>
  <!-- Courbes ondulées en fil très fin -->
  <g fill="none" stroke="#1B4F8A" stroke-opacity="0.08" stroke-width="1">
    <path d="M0 220 Q 480 140 960 240 T 1920 200"/>
    <path d="M0 280 Q 480 200 960 300 T 1920 260"/>
    <path d="M0 340 Q 480 260 960 360 T 1920 320"/>
    <path d="M0 800 Q 480 720 960 820 T 1920 780"/>
    <path d="M0 860 Q 480 780 960 880 T 1920 840"/>
  </g>
  <g fill="none" stroke="#C9266A" stroke-opacity="0.10" stroke-width="1">
    <path d="M0 500 Q 480 420 960 540 T 1920 480"/>
    <path d="M0 560 Q 480 480 960 600 T 1920 540"/>
  </g>
  <!-- Cercles décoratifs sphériques très diffus -->
  <circle cx="280" cy="180" r="48" fill="none" stroke="#2B6CC4" stroke-opacity="0.18" stroke-width="0.8"/>
  <circle cx="280" cy="180" r="78" fill="none" stroke="#2B6CC4" stroke-opacity="0.10" stroke-width="0.8"/>
  <circle cx="1640" cy="220" r="32" fill="none" stroke="#C9266A" stroke-opacity="0.22" stroke-width="0.8"/>
  <circle cx="1640" cy="220" r="58" fill="none" stroke="#C9266A" stroke-opacity="0.12" stroke-width="0.8"/>
  <circle cx="1640" cy="220" r="90" fill="none" stroke="#C9266A" stroke-opacity="0.06" stroke-width="0.8"/>
  <circle cx="1740" cy="880" r="50" fill="none" stroke="#1B4F8A" stroke-opacity="0.16" stroke-width="0.8"/>
  <circle cx="180" cy="920" r="38" fill="none" stroke="#E8527E" stroke-opacity="0.20" stroke-width="0.8"/>
  <!-- Quelques points/étoiles -->
  <g fill="#1B4F8A">
    <circle cx="450" cy="120" r="2.4" opacity="0.5"/>
    <circle cx="820" cy="80" r="1.8" opacity="0.35"/>
    <circle cx="1480" cy="500" r="2.0" opacity="0.4"/>
    <circle cx="160" cy="640" r="2.2" opacity="0.45"/>
    <circle cx="1380" cy="980" r="1.6" opacity="0.3"/>
  </g>
  <g fill="#C9266A">
    <circle cx="1100" cy="180" r="2.2" opacity="0.4"/>
    <circle cx="720" cy="940" r="2.0" opacity="0.4"/>
    <circle cx="1860" cy="600" r="1.8" opacity="0.35"/>
  </g>
  <!-- Très léger grain pour casser le côté propre -->
  <rect width="1920" height="1080" filter="url(#grain)" opacity="0.5"/>
</svg>
